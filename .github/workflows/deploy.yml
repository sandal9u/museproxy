name: deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker (API direct upload)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PX_KEY: ${{ secrets.PX_KEY }}
          PX_HOSTNAME: px.nbfun.com
          PX_ZONE: nbfun.com
        run: python3 deploy.py
      - name: Smoke check
        run: |
          for i in $(seq 1 12); do
            page=$(curl -s --max-time 30 "https://px.nbfun.com/https/example.com/")
            echo "$page" | grep -q "Welcome to nginx" && { echo "try $i: unauthed entry sees decoy OK"; break; }
            echo "try $i: waiting for new deployment"; sleep 10
          done
          echo "$page" | grep -q "Welcome to nginx"
          curl -s -H "Accept: text/html" --max-time 30 "https://px.nbfun.com/https/example.com/" | grep -q 'id="k"' && echo "browser unauthed sees key box OK"
          root=$(curl -s --max-time 30 "https://px.nbfun.com/")
          echo "$root" | grep -q "Welcome to nginx" && echo "root decoy OK"
          curl -s --max-time 30 "https://px.nbfun.com/robots.txt" | grep -q "Disallow: /" && echo "robots OK"
