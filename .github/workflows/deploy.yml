name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker (API direct upload)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PX_KEY: ${{ secrets.PX_KEY }}
          PX_HOSTNAME: px.nbfun.com
          PX_ZONE: nbfun.com
        run: python3 deploy.py
      - name: Smoke check
        env:
          PX_KEY: ${{ secrets.PX_KEY }}
        run: |
          jar=$(mktemp)
          for i in $(seq 1 12); do
            page=$(curl -s --max-time 30 "https://px.nbfun.com/https/example.com/")
            echo "$page" | grep -q 'name="code"' && { echo "try $i: unlock page OK"; break; }
            echo "try $i: waiting for new deployment"; sleep 10
          done
          echo "$page" | grep -q 'name="code"'
          curl -s -c "$jar" -o /dev/null --max-time 30 -X POST "https://px.nbfun.com/auth" \
            --data-urlencode "code=$PX_KEY" --data-urlencode "next=/https/example.com/"
          curl -s -b "$jar" --max-time 30 "https://px.nbfun.com/https/example.com/" | grep -q "Example Domain" && echo "unlock + proxied example.com OK"
          curl -s -H "X-Px-Key: $PX_KEY" --max-time 30 "https://px.nbfun.com/https/example.com/" | grep -q "Example Domain" && echo "header auth OK"
          curl -s --max-time 30 "https://px.nbfun.com/https/example.com/?pxk=$PX_KEY" | grep -q "Example Domain" && echo "query auth OK"
          root=$(curl -s --max-time 30 "https://px.nbfun.com/")
          echo "$root" | grep -q "Welcome to nginx" && echo "root decoy OK"
          curl -s --max-time 30 "https://px.nbfun.com/robots.txt" | grep -q "Disallow: /" && echo "robots OK"
          rm -f "$jar"
