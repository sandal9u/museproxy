name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker (API direct upload)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PX_KEY: ${{ secrets.PX_KEY }}
        run: python3 deploy.py
      - name: Smoke check
        env:
          PX_KEY: ${{ secrets.PX_KEY }}
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://px.gorou-public.workers.dev/$PX_KEY/https://example.com/")
          echo "proxied example.com: $code"
          test "$code" = "200"
          code2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://px.gorou-public.workers.dev/https://example.com/")
          echo "no-key request: $code2"
          test "$code2" = "404"
