name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker (API direct upload)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PX_KEY: ${{ secrets.PX_KEY }}
          PX_HOSTNAME: px.nbfun.com
          PX_ZONE: nbfun.com
        run: python3 deploy.py
      - name: Smoke check
        env:
          PX_KEY: ${{ secrets.PX_KEY }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://px.nbfun.com/$PX_KEY/https://example.com/")
            echo "try $i proxied example.com via px.nbfun.com: $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200"
          root=$(curl -s --max-time 30 "https://px.nbfun.com/")
          echo "$root" | grep -q "Welcome to nginx" && echo "root decoy OK"
          direct=$(curl -s --max-time 30 "https://px.nbfun.com/https://example.com/")
          echo "$direct" | grep -q "Welcome to nginx" && echo "unauthenticated direct entry sees decoy OK"
          curl -s --max-time 30 "https://px.nbfun.com/robots.txt" | grep -q "Disallow: /" && echo "robots OK"
